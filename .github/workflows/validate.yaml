name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, to catch a new Home Assistant release breaking the integration
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "home-assistant/actions/hassfest@master"

  hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

  tests:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements_test.txt"
      - name: Install test requirements
        run: pip install -r requirements_test.txt
      - name: Lint
        run: ruff check custom_components tests
      - name: Test
        run: pytest
      - name: Check the changelog covers the manifest version
        run: bash scripts/release.sh --check

  release:
    # A new version in manifest.json on main is published once the checks pass
    needs: [hassfest, hacs, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - uses: "actions/checkout@v7"
      - name: Publish the release if this version has none yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh
